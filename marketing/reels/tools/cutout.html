<!doctype html><meta charset="utf-8">
<body style="margin:0">
<script>
// Remove the neutral light background from the intact Mila image by flood-filling from the edges.
// The fill only spreads through near-white NEUTRAL pixels; Mila's fur is warm white, so it stops there.
(async () => {
  const img = new Image();
  img.src = '../../../assets/neli-world/characters/Mila/cheerful_bunny_waving_in_style.webp';
  await img.decode();
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0);
  const im = g.getImageData(0, 0, W, H), d = im.data;
  const T = +(new URLSearchParams(location.search).get('t') || 4);   // max channel spread that still counts as neutral
  const isBg = o => { const r = d[o], gg = d[o + 1], b = d[o + 2]; return Math.min(r, gg, b) >= 225 && Math.max(r, gg, b) - Math.min(r, gg, b) <= T; };
  const seen = new Uint8Array(W * H), stack = [];
  for (let x = 0; x < W; x++) { stack.push(x, (H - 1) * W + x); }
  for (let y = 0; y < H; y++) { stack.push(y * W, y * W + W - 1); }
  while (stack.length) {
    const p = stack.pop(); if (seen[p]) continue;
    if (!isBg(p * 4)) continue;
    seen[p] = 1;
    const x = p % W, y = (p / W) | 0;
    if (x > 0) stack.push(p - 1); if (x < W - 1) stack.push(p + 1);
    if (y > 0) stack.push(p - W); if (y < H - 1) stack.push(p + W);
  }
  // Edge clean-up. The flood gives a hard, stair-stepped mask with small notches.
  // 1) blur the mask and re-threshold at 50%: fills notches and rounds the steps into a smooth contour
  // 2) blur that smooth mask a little and use it as alpha: a ~1px anti-aliased edge
  const boxBlur = (src, r) => {            // separable box blur, 3 passes ~ gaussian
    let a = Float32Array.from(src), t = new Float32Array(W * H);
    for (let pass = 0; pass < 3; pass++) {
      for (let y = 0; y < H; y++) { let s = 0; const row = y * W;
        for (let x = -r; x <= r; x++) s += a[row + Math.min(W - 1, Math.max(0, x))];
        for (let x = 0; x < W; x++) { t[row + x] = s / (2 * r + 1);
          s += a[row + Math.min(W - 1, x + r + 1)] - a[row + Math.max(0, x - r)]; } }
      for (let x = 0; x < W; x++) { let s = 0;
        for (let y = -r; y <= r; y++) s += t[Math.min(H - 1, Math.max(0, y)) * W + x];
        for (let y = 0; y < H; y++) { a[y * W + x] = s / (2 * r + 1);
          s += t[Math.min(H - 1, y + r + 1) * W + x] - t[Math.max(0, y - r) * W + x]; } }
    }
    return a;
  };
  const SMOOTH = +(new URLSearchParams(location.search).get('s') || 3);
  const mask = new Float32Array(W * H);
  for (let p = 0; p < W * H; p++) mask[p] = seen[p] ? 0 : 1;
  const soft = boxBlur(mask, SMOOTH);
  // threshold a bit above 50% to pull the edge in ~1px, dropping the light rim left by the old white background
  const CUT = +(new URLSearchParams(location.search).get("c") || 0.62);
  for (let p = 0; p < W * H; p++) mask[p] = soft[p] >= CUT ? 1 : 0;
  const alpha = boxBlur(mask, 1);
  for (let p = 0; p < W * H; p++) {
    d[p * 4 + 3] = Math.round(255 * Math.min(1, Math.max(0, (alpha[p] - 0.35) / 0.6)));
    // pixels the clean-up added back were background-coloured; give them the fur colour
    if (seen[p] && mask[p]) { d[p * 4] = 254; d[p * 4 + 1] = 248; d[p * 4 + 2] = 244; }
  }
  g.putImageData(im, 0, 0);
  // trim to the visible character
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const out = document.createElement('canvas'); out.width = x1 - x0 + 21; out.height = y1 - y0 + 21;
  out.getContext('2d').drawImage(c, x0 - 10, y0 - 10, out.width, out.height, 0, 0, out.width, out.height);
  window.RESULT = out.toDataURL('image/png');
  document.title = 'done';
})();
</script>
